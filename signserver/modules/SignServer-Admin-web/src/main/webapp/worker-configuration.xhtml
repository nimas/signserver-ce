<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:a="jakarta.faces.passthrough">

    <f:metadata>
        <f:viewParam name="id" value="#{workerBean.id}"/>
        <f:viewParam name="id" value="#{workerValidationBean.id}"/>
        <ui:param name="isReadOnly" value="#{adminWebBean.readOnlyWorkers.contains(workerBean.id)}"/>
    </f:metadata>
   
    <body>

        <ui:composition template="WEB-INF/templates/template.xhtml">
            <ui:param name="activeMenu" value="workers"/>

            <ui:define name="title">
                <h:outputFormat value="#{text['Worker_X']}">
                    <f:param value="#{workerBean.worker.name}"/>
                </h:outputFormat>
                <h:outputText value="- #{text['Configuration']}"/>
            </ui:define>

            <ui:define name="top">
                
            </ui:define>

            <ui:define name="content">
                <ui:include src="/worker-menu.xhtml">
                    <ui:param name="worker" value="#{workerBean.worker}"/>
                    <ui:param name="workerActiveMenu" value="worker-configuration"/>
                </ui:include>
                
                <h:panelGroup rendered="#{workerBean.worker.existing}">
                    <div id="worker-actions">
                        <h:form>
                            <p>
                                <h:commandButton class="buttonNeutral" value="#{text['Reload_From_Database...']}" action="#{workerBean.bulkAction('workers-reload', 'worker-configuration')}"/> 
                                <h:commandButton class="buttonNeutral" value="#{text['Export...']}" action="#{workerBean.bulkAction('workers-export', 'worker-configuration')}"/>
                            </p>
                        </h:form>
                    </div>   

                    <div id="worker_content">

                        <h2><h:outputText value="#{text['Properties']}"/></h2>

                        <h:form>
                            <h:dataTable id="table1" value="#{workerBean.config}" var="item" class="dss1" headerClass="dss1" footerClass="dss1" columnClasses="dss1 centered,dss1,dss1,dss1" rowClasses="dss1,dss1_odd">
                                <h:column>
                                    <f:facet name="header">
                                        <h:selectBooleanCheckbox class="jsHidden" onclick="toggleCheckboxes(this, document.getElementsByClassName('allSelectable'))"/>
                                    </f:facet>
                                    <h:selectBooleanCheckbox value="#{workerBean.selectedProperties[item.key]}" class="allSelectable"/>
                                </h:column>
                                <h:column>
                                    <f:facet name="header">
                                        <h:outputText value="#{text['Property']}" />
                                    </f:facet>
                                    <h:outputText value="#{item.key}" />
                                </h:column>
                                <h:column>
                                    <f:facet name="header">
                                        <h:outputText value="#{text['Value']}" />
                                    </f:facet>
                                    <h:outputText value="#{item.value}" />
                                </h:column>
                                <h:column>
                                    <f:facet name="header">
                                        <h:outputText value="#{text['Actions']}"/>
                                    </f:facet>
                                    <h:link value="#{text['Edit']}" outcome="worker-configuration-edit">
                                        <f:param name="id" value="#{workerBean.worker.id}"/>
                                        <f:param name="property" value="#{item.key}"/>
                                    </h:link> |
                                    <h:link class="linkNegative" value="#{text['Remove']}" outcome="worker-configuration-remove">
                                        <f:param name="id" value="#{workerBean.worker.id}"/>
                                        <f:param name="property" value="#{item.key}"/>
                                    </h:link>
                                </h:column>
                                <f:facet name="footer">
                                </f:facet>
                            </h:dataTable>

                        <h:link class="linkPositive" value="#{text['Add...']}" outcome="worker-configuration-add"><f:param name="id" value="#{workerBean.worker.id}"/></h:link>
                        <h:commandButton class="buttonNegative" value="#{text['Remove_Selected...']}" action="#{workerBean.bulkActionProperties('worker-configuration-remove')}"/>
                        </h:form>

                        <h2 id="validate"><h:outputText value="#{text['Validate_Configuration']}"/></h2>
                        <h:form id="validateForm">
                            <p>
                                <h:outputLabel for="cli" value="#{text['Validate_Cli_Label']}"/><br/>
                                <h:inputTextarea id="cli" value="#{workerValidationBean.cli}" cols="100" rows="2"
                                                 a:placeholder="signclient signdocument -workername #{workerBean.worker.name} -infile document.txt -outfile signed.p7s"/>
                            </p>
                            <p>
                                <h:commandButton id="validateButton" class="buttonPositive" value="#{text['Validate']}" action="#{workerValidationBean.validate}"/>
                            </p>

                            <h:panelGroup rendered="#{not empty workerValidationBean.error}">
                                <p class="errorMessage"><h:outputText value="#{workerValidationBean.error}"/></p>
                            </h:panelGroup>

                            <h:panelGroup id="validationResult" rendered="#{workerValidationBean.validated}">
                                <p>
                                    <h:outputText class="successMessage" rendered="#{workerValidationBean.passed}" value="#{text['Validation_Passed']}"/>
                                    <h:outputText class="errorMessage" rendered="#{!workerValidationBean.passed}" value="#{text['Validation_Failed']}"/>
                                    <h:outputText value=" (#{workerValidationBean.summary})"/>
                                </p>
                                <h:dataTable value="#{workerValidationBean.rows}" var="row" rendered="#{not empty workerValidationBean.rows}"
                                             class="dss1" headerClass="dss1" columnClasses="dss1,dss1,dss1,dss1,dss1" rowClasses="dss1,dss1_odd">
                                    <h:column>
                                        <f:facet name="header"><h:outputText value="#{text['Validation_Severity']}"/></f:facet>
                                        <h:outputText class="#{row.styleClass}" value="#{row.severity}"/>
                                    </h:column>
                                    <h:column>
                                        <f:facet name="header"><h:outputText value="#{text['Validation_Section']}"/></f:facet>
                                        <h:outputText value="#{row.section}"/>
                                    </h:column>
                                    <h:column>
                                        <f:facet name="header"><h:outputText value="#{text['Property']}"/></f:facet>
                                        <h:outputText value="#{row.target}"/>
                                    </h:column>
                                    <h:column>
                                        <f:facet name="header"><h:outputText value="#{text['Validation_Finding']}"/></f:facet>
                                        <h:outputText value="#{row.message}"/>
                                        <h:panelGroup rendered="#{not empty row.suggestion}">
                                            <br/><i><h:outputText value="#{row.suggestion}"/></i>
                                        </h:panelGroup>
                                    </h:column>
                                    <h:column>
                                        <f:facet name="header"><h:outputText value="#{text['Validation_Code']}"/></f:facet>
                                        <h:outputText value="#{row.code}"/>
                                    </h:column>
                                </h:dataTable>
                                <details>
                                    <summary><h:outputText value="#{text['Validation_Json']}"/></summary>
                                    <pre><h:outputText value="#{workerValidationBean.reportJson}"/></pre>
                                </details>
                            </h:panelGroup>
                        </h:form>
                    </div>
                </h:panelGroup>
                <h:panelGroup rendered="#{!workerBean.worker.existing}">
                    <h2><h:outputText value="#{text['Worker_Not_Found']}"/></h2>
                    <p>
                        <h:outputText value="#{text['The_specified_worker_can_not_be_found.']}"/>
                    </p>
                </h:panelGroup>
            </ui:define>

            <ui:define name="bottom">
            </ui:define>

        </ui:composition>

    </body>
</html>
