# yaml-language-server: $schema=../schema/catalog.schema.json#/$defs/cliOptionGroupFile
#
# TLS / client authentication options shared by all signclient commands
# (KeyStoreOptions.getKeyStoreOptions()).
optionGroup: keystore-options
options:
  truststore: { arg: true, type: path, description: "Truststore with the TLS server CA" }
  truststorepwd: { arg: true, sensitive: true }
  keystore: { arg: true, type: path, description: "Keystore with the client TLS certificate" }
  keystorepwd: { arg: true, sensitive: true }
  keyalias: { arg: true }
  keyaliasprompt: { arg: false }
  signkeyalias: { arg: true }
  signkeyaliasprompt: { arg: false }
  keystoretype:
    arg: true
    type: string
    allowedValues: [JKS, PKCS11, PKCS11_CONFIG]
    caseSensitive: true
  passwordfromstdin: { arg: false }
  signrequest: { arg: false }
  nohttps: { arg: false }
rules:
  - id: KSO-1
    when: { all: [ { cli.hasOption: keyalias }, { cli.hasOption: keyaliasprompt } ] }
    severity: ERROR
    option: keyalias
    message: "Can not supply both -keyalias and -keyaliasprompt"
  - id: KSO-2
    when: { all: [ { cli.hasOption: signkeyalias }, { cli.hasOption: signkeyaliasprompt } ] }
    severity: ERROR
    option: signkeyalias
    message: "Can not supply both -signkeyalias and -signkeyaliasprompt"
  - id: KSO-3
    when: { cli.hasOption: signrequest }
    require: { cli.hasOption: keystore }
    severity: ERROR
    option: signrequest
    message: "-signrequest requires -keystore"
  - id: KSO-4
    when: { all: [ { cli.hasOption: nohttps }, { any: [ { cli.hasOption: keystore }, { cli.hasOption: truststore } ] } ] }
    severity: WARNING
    option: nohttps
    message: "-truststore/-keystore are not used together with -nohttps"
extraction:
  sources:
    - modules/SignServer-Client-CLI/src/main/java/org/signserver/client/cli/defaultimpl/KeyStoreOptions.java
