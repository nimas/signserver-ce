# yaml-language-server: $schema=../schema/catalog.schema.json#/$defs/groupFile
#
# KeystoreCryptoToken: keys in a PKCS#12 / JKS file or in the database (INTERNAL).
group: keystore-crypto-token
description: "Properties of org.signserver.server.cryptotokens.KeystoreCryptoToken"
doc: "doc/htdocs/Keystore_Crypto_Token.html"
properties:
  KEYSTORETYPE:
    type: string
    allowedValues: [PKCS12, JKS, INTERNAL]
    caseSensitive: true
    required: true
    description: "Keystore type: PKCS12, JKS or INTERNAL (case-sensitive)"
    source: "KeystoreCryptoToken.init: KEYSTORETYPE should be either PKCS12, JKS, or INTERNAL"
  KEYSTOREPATH:
    type: path
    description: "Path to the keystore file (PKCS12 and JKS)"
    source: "KeystoreCryptoToken.KEYSTOREPATH"
  KEYSTOREPASSWORD:
    type: string
    sensitive: true
    description: "Keystore password for auto-activation"
    source: "KeystoreCryptoToken.KEYSTOREPASSWORD"
rules:
  - id: KS-PATH-1
    when: { in: { KEYSTORETYPE: [PKCS12, JKS] } }
    require: { present: KEYSTOREPATH }
    severity: ERROR
    property: KEYSTOREPATH
    message: "KEYSTOREPATH is required when KEYSTORETYPE=${KEYSTORETYPE}"
    source: "KeystoreCryptoToken.init: Missing KEYSTOREPATH property"
  - id: KS-PATH-2
    when: { equals: { KEYSTORETYPE: INTERNAL } }
    require: { absent: KEYSTOREPATH }
    severity: WARNING
    property: KEYSTOREPATH
    message: "KEYSTOREPATH is ignored when KEYSTORETYPE=INTERNAL (the keystore is stored in the database)"
  - id: KS-PATH-3
    description: "The server checks the file exists and is in the deploy-time allowlist; the validator cannot"
    when: { present: KEYSTOREPATH }
    severity: INFO
    property: KEYSTOREPATH
    message: "Make sure '${KEYSTOREPATH}' exists on the SignServer host and is allowed by the deploy-time keystore path allowlist"
  - id: KS-ACT-1
    when: { absent: KEYSTOREPASSWORD }
    severity: INFO
    property: KEYSTOREPASSWORD
    message: "KEYSTOREPASSWORD is not set: the token must be activated manually (signserver activatecryptotoken) after every restart"
