# yaml-language-server: $schema=../schema/catalog.schema.json#/$defs/testFile
tests:
  - name: cms-with-pdf-property-is-wrong-worker
    description: "VISIBLE_SIGNATURE_CUSTOM_IMAGE_PATH belongs to PDFSigner"
    config:
      NAME: CMSSigner
      TYPE: PROCESSABLE
      IMPLEMENTATION_CLASS: org.signserver.module.cmssigner.CMSSigner
      CRYPTOTOKEN: CryptoTokenP12
      DEFAULTKEY: signer00003
      VISIBLE_SIGNATURE_CUSTOM_IMAGE_PATH: /tmp/x.png
    expectPassed: false
    expectCodes: ["PROP_WRONG_WORKER:VISIBLE_SIGNATURE_CUSTOM_IMAGE_PATH"]

  - name: pdf-invalid-digestalgorithm
    config:
      NAME: PDFSigner
      TYPE: PROCESSABLE
      IMPLEMENTATION_CLASS: org.signserver.module.pdfsigner.PDFSigner
      CRYPTOTOKEN: CryptoTokenP12
      DEFAULTKEY: signer00003
      DIGESTALGORITHM: xyz
    expectPassed: false
    expectCodes: ["VALUE_INVALID:DIGESTALGORITHM"]

  - name: cms-digestalgorithm-is-pdf-property-and-invalid
    extends: cms-with-pdf-property-is-wrong-worker
    config:
      VISIBLE_SIGNATURE_CUSTOM_IMAGE_PATH: ""
      DIGESTALGORITHM: xyz
    expectPassed: false
    expectCodes: ["PROP_WRONG_WORKER:DIGESTALGORITHM", "VALUE_INVALID:DIGESTALGORITHM"]

  - name: cms-typo-gets-suggestion
    config:
      NAME: CMSSigner
      TYPE: PROCESSABLE
      IMPLEMENTATION_CLASS: org.signserver.module.cmssigner.CMSSigner
      CRYPTOTOKEN: CryptoTokenP12
      DEFAULTKEY: signer00003
      DETACHEDSIGNATUR: "TRUE"
    expectPassed: true
    expectCodes: ["PROP_UNKNOWN:DETACHEDSIGNATUR"]

  - name: cms-bad-boolean
    config:
      NAME: CMSSigner
      TYPE: PROCESSABLE
      IMPLEMENTATION_CLASS: org.signserver.module.cmssigner.CMSSigner
      CRYPTOTOKEN: CryptoTokenP12
      DEFAULTKEY: signer00003
      DETACHEDSIGNATURE: "yes"
    expectPassed: false
    expectCodes: ["VALUE_INVALID:DETACHEDSIGNATURE"]

  - name: cms-clientside-without-accepted-algorithms
    config:
      NAME: CMSSigner
      TYPE: PROCESSABLE
      IMPLEMENTATION_CLASS: org.signserver.module.cmssigner.CMSSigner
      CRYPTOTOKEN: CryptoTokenP12
      DEFAULTKEY: signer00003
      CLIENTSIDEHASHING: "TRUE"
    expectPassed: false
    expectCodes: ["RULE_CSH-1:ACCEPTED_HASH_DIGEST_ALGORITHMS"]

  - name: missing-required-and-bad-type
    config:
      NAME: CMSSigner
      TYPE: processable
      IMPLEMENTATION_CLASS: org.signserver.module.cmssigner.CMSSigner
    expectPassed: false
    expectCodes: ["VALUE_INVALID:TYPE", "RULE_BP-TOKEN-1"]

  - name: cryptotoken-reference-to-missing-worker
    config:
      NAME: CMSSigner
      TYPE: PROCESSABLE
      IMPLEMENTATION_CLASS: org.signserver.module.cmssigner.CMSSigner
      CRYPTOTOKEN: NoSuchToken
      DEFAULTKEY: signer00003
    otherWorkers:
      - NAME: CryptoTokenP12
        TYPE: CRYPTO_WORKER
        IMPLEMENTATION_CLASS: org.signserver.server.signers.CryptoWorker
        CRYPTOTOKEN_IMPLEMENTATION_CLASS: org.signserver.server.cryptotokens.KeystoreCryptoToken
        KEYSTORETYPE: PKCS12
        KEYSTOREPATH: /tmp/ks.p12
    expectPassed: false
    expectCodes: ["RULE_BP-TOKEN-2:CRYPTOTOKEN"]

  - name: cryptotoken-reference-unverifiable-offline
    config:
      NAME: CMSSigner
      TYPE: PROCESSABLE
      IMPLEMENTATION_CLASS: org.signserver.module.cmssigner.CMSSigner
      CRYPTOTOKEN: CryptoTokenP12
      DEFAULTKEY: signer00003
    expectPassed: true
    expectCodes: ["NOT_VERIFIED:CRYPTOTOKEN"]

  - name: keystore-bad-type-and-missing-path
    config:
      NAME: CryptoTokenP12
      TYPE: CRYPTO_WORKER
      IMPLEMENTATION_CLASS: org.signserver.server.signers.CryptoWorker
      CRYPTOTOKEN_IMPLEMENTATION_CLASS: org.signserver.server.cryptotokens.KeystoreCryptoToken
      KEYSTORETYPE: PEM
    expectPassed: false
    expectCodes: ["VALUE_INVALID:KEYSTORETYPE"]

  - name: keystore-pkcs12-without-path
    config:
      NAME: CryptoTokenP12
      TYPE: CRYPTO_WORKER
      IMPLEMENTATION_CLASS: org.signserver.server.signers.CryptoWorker
      CRYPTOTOKEN_IMPLEMENTATION_CLASS: org.signserver.server.cryptotokens.KeystoreCryptoToken
      KEYSTORETYPE: PKCS12
    expectPassed: false
    expectCodes: ["RULE_KS-PATH-1:KEYSTOREPATH"]

  - name: signer-property-on-crypto-worker
    config:
      NAME: CryptoTokenP12
      TYPE: CRYPTO_WORKER
      IMPLEMENTATION_CLASS: org.signserver.server.signers.CryptoWorker
      CRYPTOTOKEN_IMPLEMENTATION_CLASS: org.signserver.server.cryptotokens.KeystoreCryptoToken
      KEYSTORETYPE: INTERNAL
      DETACHEDSIGNATURE: "TRUE"
    expectPassed: false
    expectCodes: ["PROP_WRONG_WORKER:DETACHEDSIGNATURE"]

  - name: pdf-tsa-url-and-worker
    config:
      NAME: PDFSigner
      TYPE: PROCESSABLE
      IMPLEMENTATION_CLASS: org.signserver.module.pdfsigner.PDFSigner
      CRYPTOTOKEN: CryptoTokenP12
      DEFAULTKEY: signer00003
      TSA_URL: http://tsa.example.com/tsa
      TSA_WORKER: TimeStampSigner
      CERTIFICATION_LEVEL: SOMETIMES
      ALLOW_PROPERTY_OVERRIDE: REASON,ARCHIVETODISK_PATH_BASE
    expectPassed: false
    expectCodes: ["RULE_PDF-TSA-1", "VALUE_INVALID:CERTIFICATION_LEVEL", "RULE_PDF-OVR-1"]

  - name: unknown-implementation-class
    config:
      NAME: MySigner
      TYPE: PROCESSABLE
      IMPLEMENTATION_CLASS: com.example.MySigner
      CRYPTOTOKEN: CryptoTokenP12
      SOMETHING: "1"
    expectPassed: true
    expectCodes: ["WORKER_TYPE_UNKNOWN:IMPLEMENTATION_CLASS"]
    forbidCodes: [PROP_UNKNOWN]
