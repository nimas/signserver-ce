# yaml-language-server: $schema=../schema/catalog.schema.json#/$defs/workerFile
worker: KeystoreCryptoWorker
description: "Crypto worker holding keys in a PKCS#12/JKS keystore file or in the database (KeystoreCryptoToken)"
kind: crypto
doc: "doc/htdocs/Keystore_Crypto_Token.html"
match:
  IMPLEMENTATION_CLASS: org.signserver.server.signers.CryptoWorker
  CRYPTOTOKEN_IMPLEMENTATION_CLASS: org.signserver.server.cryptotokens.KeystoreCryptoToken
inherits: [base-worker, crypto-token, keystore-crypto-token]
rules:
  - id: KSW-TYPE-1
    require: { equals: { TYPE: CRYPTO_WORKER } }
    severity: ERROR
    property: TYPE
    message: "TYPE is '${TYPE}' but a crypto worker must have TYPE=CRYPTO_WORKER"
extraction:
  sources:
    - modules/SignServer-Server/src/main/java/org/signserver/server/cryptotokens/KeystoreCryptoToken.java
  ignoreConstants:
    - PKCS12          # KEYSTORETYPE value
    - JKS             # KEYSTORETYPE value
    - INTERNAL        # KEYSTORETYPE value
